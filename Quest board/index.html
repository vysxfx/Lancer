<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identieke HUD Interface</title>
  <link rel="stylesheet" href="./style/style.css">
</head>
<body class="fixed-screen">


  
  <div class="hud-top-bar">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none">
      <path d="M 0,0 L 1200,0 L 1200,15 L 950,15 L 920,35 L 280,35 L 250,15 L 0,15 Z" fill="#011625" stroke="#00bfff" stroke-width="1.5"/>
      <path d="M 290,25 L 910,25" stroke="#00bfff" stroke-width="1" stroke-dasharray="20 10"/>
    </svg>
  </div>

  
  <div class="hud-main-container">
    
    
    <div class="left-menu-panel">
      
      
      <div class="hud-button-wrapper">
        <svg viewBox="0 0 300 80" class="hud-svg-shape">

          <path d="M 270,5 L 295,5 L 295,25" fill="none" stroke="#00f5ff" stroke-width="3" />
          <path d="M 275,70 L 280,75 M 280,70 L 285,75 M 285,70 L 290,75" stroke="#00f5ff" stroke-width="1.5" />
        </svg>
          <a href="first.html" class="hud-box-link">
            Missions
          </a>
      </div>

      <div class="hud-button-wrapper">
        <svg viewBox="0 0 300 80" class="hud-svg-shape"><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="url(#boxGrad)" /><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="none" stroke="#00f5ff" stroke-width="1.5" /><path d="M 5,45 L 30,15 L 55,15" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 5,55 L 5,75 L 25,75" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 270,5 L 295,5 L 295,25" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 275,70 L 280,75 M 280,70 L 285,75 M 285,70 L 290,75" stroke="#00f5ff" stroke-width="1.5" /></svg>
        <div class="button-text">Locked</div>
      </div>

      <div class="hud-button-wrapper">
        <svg viewBox="0 0 300 80" class="hud-svg-shape"><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="url(#boxGrad)" /><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="none" stroke="#00f5ff" stroke-width="1.5" /><path d="M 5,45 L 30,15 L 55,15" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 5,55 L 5,75 L 25,75" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 270,5 L 295,5 L 295,25" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 275,70 L 280,75 M 280,70 L 285,75 M 285,70 L 290,75" stroke="#00f5ff" stroke-width="1.5" /></svg>
        <div class="button-text">Locked</div>
      </div>

      <div class="hud-button-wrapper">
        <svg viewBox="0 0 300 80" class="hud-svg-shape"><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="url(#boxGrad)" /><polygon points="40,5 295,5 295,75 5,75 5,45 30,15" fill="none" stroke="#00f5ff" stroke-width="1.5" /><path d="M 5,45 L 30,15 L 55,15" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 5,55 L 5,75 L 25,75" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 270,5 L 295,5 L 295,25" fill="none" stroke="#00f5ff" stroke-width="3" /><path d="M 275,70 L 280,75 M 280,70 L 285,75 M 285,70 L 290,75" stroke="#00f5ff" stroke-width="1.5" /></svg>

      </div>

    </div>

    <div class="main-screen-panel">

        <rect x="15" y="15" width="670" height="470" fill="url(#screenBgGrad)" />
        <polygon points="15,45 45,15 655,15 685,45 685,455 655,485 45,485 15,455" fill="none" stroke="#00f5ff" stroke-width="1.5" />
        <polygon points="25,50 50,25 650,25 675,50 675,450 650,475 50,475 25,450" fill="none" stroke="#00a3a8" stroke-width="1" />

        <polygon points="200,475 230,455 470,455 500,475" fill="#011625" stroke="#00f5ff" stroke-width="1.5" />
        <circle cx="310" cy="35" r="2" fill="#00f5ff" /><circle cx="330" cy="35" r="2" fill="#00f5ff" /><circle cx="350" cy="35" r="2" fill="#00f5ff" /><circle cx="370" cy="35" r="2" fill="#00f5ff" /><circle cx="390" cy="35" r="2" fill="#00f5ff" />

      </svg>

      <div class="screen-content-overlay">
        <h2>Error</h2>
        <p>SYSTEMS ONLINE // SECURE CONNECTION ESTABLISHED</p>
      </div>
    </div>

  </div>

  <div class="hud-bottom-bar">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none">
      <path d="M 0,40 L 1200,40 L 1200,25 L 950,25 L 920,5 L 280,5 L 250,25 L 0,25 Z" fill="#011625" stroke="#00bfff" stroke-width="1.5"/>
      <path d="M 290,15 L 910,15" stroke="#00bfff" stroke-width="1" stroke-dasharray="20 10"/>
    </svg>
  </div>

  <svg width="0" height="0" style="position: absolute;">
    <defs>
   
      <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#021a2e" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#010c14" stop-opacity="0.9" />
      </linearGradient>
    
      <radialGradient id="screenBgGrad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#04233c" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#010a12" stop-opacity="0.8" />
      </radialGradient>
    </defs>
  </svg>

</body>
